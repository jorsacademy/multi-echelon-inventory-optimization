[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperopt-inventory-policy-optimization"
version = "0.1.0"
description = "Stochastic inventory policy optimization with Hyperopt"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "hyperopt==0.3.0",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
hyperopt-inventory-demo = "hyperopt_inventory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=hyperopt_inventory --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
