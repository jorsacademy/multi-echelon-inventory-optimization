[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "conformal-prediction-robust-inventory-optimization"
version = "0.1.0"
description = "Simultaneous split-conformal demand bands coupled to exact small-horizon robust inventory LPs."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
bnn = [
  "torch>=2.2",
]

[tool.setuptools.packages.find]
include = ["conformal_inventory*"]
