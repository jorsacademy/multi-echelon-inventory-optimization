name: tests

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-bnn.txt

      - name: Print numerical stack
        run: |
          python - <<'PY'
          import numpy, scipy, sklearn, torch
          print("numpy", numpy.__version__)
          print("scipy", scipy.__version__)
          print("scikit-learn", sklearn.__version__)
          print("torch", torch.__version__)
          PY

      - name: Run conformal inventory self-test
        run: python run_conformal_inventory.py --self-test

      - name: Run regression suite
        run: python -m unittest discover -s tests -v

      - name: Run coverage robust-LP and SAA smoke experiment
        run: |
          python run_conformal_inventory.py \
            --seed 42 \
            --horizon 5 \
            --train-samples 180 \
            --calibration-samples 80 \
            --test-samples 120 \
            --planning-samples 12 \
            --trees 80 \
            --alpha 0.10 \
            --distribution-reference-contexts 2 \
            --saa-scenarios 64 \
            --reference-eval-scenarios 128

      - name: Run Bayesian predictor smoke experiment
        run: |
          python run_conformal_inventory.py \
            --predictor bnn \
            --seed 43 \
            --horizon 4 \
            --train-samples 120 \
            --calibration-samples 50 \
            --test-samples 70 \
            --planning-samples 4 \
            --bnn-hidden 12 \
            --bnn-steps 80 \
            --bnn-train-samples 2 \
            --bnn-prediction-samples 30 \
            --alpha 0.10 \
            --distribution-reference-contexts 0
